name: RSG Release Branch-Cut Automation

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release Version (e.g. 25.08)"
        required: true

      service_group:
        description: "Target Service Group"
        required: true
        type: choice
        options:
          - Core Services
          - Edge Services
          - Shared Components
          - Infrastructure

      base_branch:
        description: "Source Branch"
        required: true
        default: main

      execution_mode:
        description: "Execution Mode"
        required: true
        default: Preview
        type: choice
        options:
          - Preview
          - Apply

permissions:
  contents: write
  pull-requests: write

jobs:

  initialize:
    name: Initialize Release
    runs-on: ubuntu-latest

    outputs:
      repository_matrix: ${{ steps.discovery.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Inputs
        run: |
          echo "Release: ${{ inputs.release_version }}"
          echo "Service Group: ${{ inputs.service_group }}"

      - name: Discover Target Repositories
        id: discovery
        run: |
          python scripts/discover_repositories.py

# --------------------------------------------------------

  base-branch-validation:
    name: Validate Base Branch
    needs: initialize
    runs-on: ubuntu-latest

    steps:
      - name: Verify Base Branch
        run: |
          echo "Checking base branch..."
          echo "${{ inputs.base_branch }}"

      - name: Generate Repository Mapping
        run: |
          python scripts/generate_release_matrix.py

# --------------------------------------------------------

  approval:
    name: Release Approval
    needs: base-branch-validation

    if: inputs.execution_mode == 'Apply'

    runs-on: ubuntu-latest

    environment:
      name: Production Release

    steps:
      - name: Await Manual Approval
        run: echo "Release Approved"

# --------------------------------------------------------

  prepare-repositories:
    name: Prepare Repository Actions
    needs:
      - approval
      - initialize

    strategy:
      fail-fast: false

      matrix:
        repository: ${{ fromJson(needs.initialize.outputs.repository_matrix) }}

    runs-on: ubuntu-latest

    steps:

      - name: Validate Repository
        run: echo "${{ matrix.repository }}"

      - name: Check Existing Workflow
        id: workflow
        run: |
          echo "Checking workflow..."

      - name: Determine Repository Action
        run: |
          echo "Decision:"
          echo " • Create Workflow (if missing)"
          echo " • Create Release Branch"
          echo " • Skip if already configured"

# --------------------------------------------------------

  branch-cut:
    name: Execute Branch-Cut

    needs: prepare-repositories

    strategy:
      fail-fast: false

      matrix:
        repository: ${{ fromJson(needs.initialize.outputs.repository_matrix) }}

    uses: ./.github/workflows/release-branch.yml

    with:
      repository: ${{ matrix.repository }}
      release: ${{ inputs.release_version }}
      base_branch: ${{ inputs.base_branch }}

# --------------------------------------------------------

  validation:
    name: Post Release Validation

    needs: branch-cut

    runs-on: ubuntu-latest

    steps:

      - name: Verify Branch Creation
        run: |
          echo "Validating repositories..."

      - name: Validate Workflow Configuration
        run: |
          echo "Checking workflow status..."

# --------------------------------------------------------

  summary:
    name: Release Summary

    needs: validation

    runs-on: ubuntu-latest

    steps:

      - name: Generate Report
        run: |
          python scripts/generate_summary.py

      - name: Upload Release Report
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: reports/
